spring.application.name=backend

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Keep request bodies small; the API only ever receives tiny JSON payloads
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=8KB

# Fun Night settings (override with env vars, e.g. FUNNIGHT_CORS_ALLOWED_ORIGINS)
funnight.cors.allowed-origins=http://localhost:5173
funnight.sessions.max-active=5000
funnight.sessions.idle-timeout=PT6H
funnight.sessions.cleanup-interval-ms=300000
funnight.rate-limit.sessions-per-minute=20
