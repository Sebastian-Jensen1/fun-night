spring.application.name=funnight-server
server.port=${PORT:8080}

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# The API only ever receives tiny JSON payloads
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=8KB

# Behind a reverse proxy set FUNNIGHT_FORWARD_HEADERS=native so rate limiting sees the real
# client address. Tomcat only trusts X-Forwarded-For from private/internal proxy addresses.
server.forward-headers-strategy=${FUNNIGHT_FORWARD_HEADERS:none}

# Fun Night settings (every one can be overridden with an env var, e.g. FUNNIGHT_ROOMS_MAX_ACTIVE)
funnight.cors.allowed-origins=http://localhost:5173
funnight.rooms.max-active=5000
funnight.rooms.idle-timeout=PT6H
funnight.rooms.cleanup-interval-ms=300000
# Rooms are snapshotted here so a restart doesn't end the night. Leave empty to keep them in memory only.
funnight.rooms.data-dir=${FUNNIGHT_DATA_DIR:data/rooms}
funnight.rate-limit.rooms-per-minute=20
funnight.rate-limit.joins-per-minute=60
# Lets the host screen show a QR code with this machine's wifi address when opened on localhost.
funnight.lan-discovery=${FUNNIGHT_LAN_DISCOVERY:true}
